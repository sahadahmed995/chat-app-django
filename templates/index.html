<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, Helvetica, sans-serif;
    background-color: #f2f2f2;
}

.chat-container {
    width: 400px;
    padding: 35px;
    background-color: white;
    border-radius: 15px;
    box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
}

h1 {
    margin: 0 0 30px;
    text-align: center;
    font-size: 32px;
    color: #333;
}

.input-group {
    margin-bottom: 20px;
}

.input-group label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: bold;
    color: #444;
}

.input-group input {
    width: 100%;
    height: 45px;
    padding: 0 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    outline: none;
    font-size: 16px;
}

.input-group input:focus {
    border-color: #333;
    box-shadow: 0 0 5px rgba(0, 0, 0, 0.15);
}

.submit-btn {
    width: 100%;
    height: 45px;
    border: none;
    border-radius: 8px;
    background-color: #333;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.submit-btn:hover {
    background-color: #555;
}
    </style>
</head>
<body>
    <div class="chat-container">

        <h1>💬 Chat</h1>

        <form action="checkdata" method="POST">
            {% csrf_token %}

            <div class="input-group">
                <label for="roomname">Room Name</label>
                <input
                    id="roomname"
                    name="roomname"
                    type="text"
                    placeholder="Enter room name"
                    required
                >
            </div>

            <div class="input-group">
                <label for="username">Username</label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    placeholder="Enter your username"
                    required
                >
            </div>

            <input class="submit-btn" type="submit" value="Join Chat">
        </form>

    </div>
</body>
</html>
