{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script   src="https://code.jquery.com/jquery-3.1.1.min.js"   integrity="sha256-hVVnYaiADRTO2PzUGmuLJr8BLUSjGIZsDYGmIJLv2b8="   crossorigin="anonymous"></script>
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'index.css' %}">
</head>
<body>
    <div class="chat-container">

        <h1>💬 Chat</h1>
        <form action="checkdata" method="POST">
            {% csrf_token %}

            <div class="input-group">
                <label for="roomname">Room Name</label>
                <input
                    id="roomname"
                    name="roomname"
                    type="text"
                    placeholder="Enter room name"
                    required
                >
            </div>
            {% for message in messages %}
            <h3 class="alart">{{message}}</h3>
            {% endfor %}
            <div class="input-group">
                <label for="username">Username</label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    placeholder="Enter your username"
                    required
                >
            </div>

            <div class="todisplayflex">
                <input class="submit-btn" type="submit" value="Join Chat">
                <input id="create_btn" class="submit-btn create" type="button" value="Create room">
            </div>
        </form>
    </div>
    <div class="inactive" id="create_popup">
        <h1>💬 Chat</h1>
        <a id="close_btn">
            <i class="fa-solid fa-xmark"></i>
        </a>
        <form   id="create_room" method="POST" required>
            {% csrf_token %}
            <label for="new_Room">New Room Name:</label>
            <input type="text" id="newroomname" name="newroomname" placeholder="Enter your Room name:" required></br>
            <div id="successmessage"></div>
            <input id="create_room_btn" type="submit" value="Create">
        </form>
    </div>
</body>
<script>
    $(document).ready(function(){
        $('#create_popup').removeClass('active')
        $('#create_popup').addClass('inactive')
    })
    $('#create_btn').click(function(){
        $('#create_popup').removeClass('inactive')
        $('#create_popup').addClass('active')
    })
    $(document).on('submit', '#create_room', function(e){
        e.preventDefault();
        $.ajax({
            type: 'POST',
            url: '/create_room',
            data: {
                newroomname:$('#newroomname').val(),
                csrfmiddlewaretoken: $('input[name=csrfmiddlewaretoken]').val(),
            },
            success:function(data){
                if (data.messages == "Room created successfully"){
                    alert(data.messages)
                    window.location.href = '/'
                }else{
                    $('#successmessage').html(
                        '<p class="alart">'+data.messages+'</p>' 
                    );
                };
                 
            }
        })

    })
    $('#close_btn').click(function(){
        $('#create_popup').removeClass('active')
        $('#create_popup').addClass('inactive')
    })
</script>
<script src="https://kit.fontawesome.com/6f3c57e22e.js" crossorigin="anonymous"></script>
</html>
