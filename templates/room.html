{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script   src="https://code.jquery.com/jquery-3.1.1.min.js"   integrity="sha256-hVVnYaiADRTO2PzUGmuLJr8BLUSjGIZsDYGmIJLv2b8="   crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lightbox3@1.1.0/dist/lightbox3.css">
    <script type="module">
    import { Lightbox } from 'https://cdn.jsdelivr.net/npm/lightbox3@1.1.0/dist/lightbox3.esm.js';
    // Initialize after the module loads.
    Lightbox.init();
    </script>
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }
        h1 {
            margin: 0;
            padding: 18px 25px;
            background-color: #333;
            color: white;
            font-size: 24px;
            font-weight: 600;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        }
        body{
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
        .container{
            height: 100dvh;
            display: flex;
            padding: 20px;
            flex-direction: column;
            overflow: hidden;
            gap:20px;
            overflow: hidden;
        }
        #display{
            flex: 1;
            padding: 20px;
            background-color: rgb(231, 231, 231);
            border-radius: 10px;
            overflow-y:scroll;
            min-height: 0;
        }
        .messbox{
            padding: 20px;
            margin: 20px;
            background-color: rgb(188, 187, 187);
            border-radius: 20px;
        }
        .messbox p {
            overflow-wrap: anywhere;
            word-break: normal;
            line-height: 22px;
        }
        .messbox b{
            font-size: 18px;
        }
        .messbox span{
            color: gray;
            font-size: 14px;
        }
        .textbox{
            position:static;
            width: 100%;
        }

        .text {
            border-radius: 10px;
            padding: 20px;
            background-color: #e7e7e7;
            border-top: 1px solid #ccc;
        }

/* Form */
        .textbox form {
            display: flex;
            width: 100%;
            flex-shrink: 0;
        }
        #message {
        flex: 1;
        height: 45px;
        padding: 0 15px;
        border: 1px solid #ccc;
        outline: none;
        font-size: 16px;
        background-color: white;
        transition: 0.2s;
    }

    #message:focus {
        border-color: #666;
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.15);
    }

    .textbox input[type="submit"] {
        height: 45px;
        padding: 0 22px;
        border: none;
        background-color: #333;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s;
    }

    .textbox input[type="submit"]:hover {
        background-color: #555;
    }
    .sendimage{
        width: 200px;
        display: block;
        margin: 10px 0;
        border-radius: 20px;
        border: 2px #ccc solid;
        box-shadow: #8b8b8b 2px 2px 5px;
    }

    .textbox input[type="submit"]:active {
        transform: scale(0.97);
    }
    #image{
       display: none;
    }
    .inputimg{
        font-size: 25px;
        margin: auto 20px;
        transition: .2s;
        color: #999;
        position: relative;
    }

    .inputimg:hover{
        transform: scale(1.2);
        margin: auto 20px;
        cursor: pointer;   
        color: #555;
    }
    :root{
        --lb-image-width:1000px;
    }
    .imagepreview.active{
        display: block;
        font-size: 14px;
        position: absolute;
        top: -7px;
        right: -7px;
        background-color: #333;
        width: 20px;
        height: 20px;
        border-radius: 20px;
    }
    .imagepreview p{
        transform: translate(-50%, -50%);
        margin: 50% 0 0 50%;
        color: white;
    }
    .imagepreview{
        display: none;
    }
    @media all and (min-width:320px) and (max-width:480px){
        h1 {
            padding: 15px 20px;
            background-color: #333;
            color: white;
            font-size: 18px;
            font-weight: 600;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        }
        .text {
            border-radius: 8px;
            padding: 12px;
            background-color: #e7e7e7;
            border-top: 1px solid #ccc;
        }
        #message{
            height: 35px;
            font-size: 12px;
        }
        .messbox{
            padding: 10px 15px;
            border-radius: 10px;
        }
        .textbox input[type="submit"]{
            height: 35px;
            font-size: 12px;
            padding: 0 15px;
        }
        .messbox b{
          font-size: 14px;  
        }
        .messbox p{
            font-size: 12px;
        }
        .messbox span{
            font-size: 10px;
        }
        .sendimage{
            width: 120px;
            border-radius: 10px;
        }
        .inputimg{
            font-size: 20px;
            margin: auto 10px;
        }
        .inputimg:hover{
            transform: scale(1);
            margin: auto 10px;
            cursor: pointer;   
            color: #555;
        }
        .imagepreview.active {
            font-size: 10px;
            width: 15px;
            height: 15px;
            border-radius: 15px;
        }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Room name: {{roomname}}</h1>
    <div id="display">
    </div>

<script>
    $(document).ready(function(){
        setInterval(function(){
            $.ajax({
                type: 'GET',
                url: '/getMessages/{{roomname}}/',
                success: function(response) {
                    var display = $('#display');

                    var wasNearBottom =
                        display.scrollTop() + display.innerHeight() >=
                        display[0].scrollHeight - 20;

                    display.empty();

                    for (var key in response.messages) {
                        var startdiv = "<div class='messbox'>"
                        var enddiv = "</div>"
                        var name = "<b>"+response.messages[key].user +"</b>"
                        var mess = "<p>" +response.messages[key].value +"</p>"
                        var date = "<span>"+response.messages[key].date +"</span>"
                        var img =  "<div><a class='demo' href='"+ response.messages[key].image +"' data-lightbox='example-1'><img class='example-image sendimage' src='"+ response.messages[key].image +"' alt='image-1'></a></div>"
                        if (response.messages[key].image){
                            var temp = startdiv + name+ img + mess + date + enddiv
                        }else{
                            var temp = startdiv + name + mess + date + enddiv
                        }

                        if (response.messages[key].value || response.messages[key].image){
                            display.append(temp);
                        }    
                        
                    }
                    if (wasNearBottom) {
                        display.scrollTop(display[0].scrollHeight);
                    }
                }
            });     
        },1000)
    })
</script>


   <div class="textbox">
       <div class="text">
         <form id="post-from" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="hidden" name="username" id="username" value="{{ username }}">
            <input type="hidden" name="room_id" id="room_id" value="{{ room_id }}">
            <input type="text" name="message" id="message" placeholder="Enter you text here">
            <label for="image" class="inputimg">
                <i class="fa-regular fa-images"></i>
                <div class="imagepreview" id="imagepreview">
                    <p>1</p>
                </div>
            </label>
            <input type="file" id="image" name="image" accept="image/*">
            <input type="submit" value="send">
        </form>
       </div>
   </div>
</div>
</body>
<script>
    $(document).on('submit', '#post-from',function(e){
        e.preventDefault();

        var frmdata = new FormData(document.getElementById('post-from'))
        $.ajax({
            type:'POST',
            url:'/send',
            data: frmdata,
            processData: false,
            contentType: false,
            success: function(data){
                $('#image')[0].value = ''
            }
        });
        document.getElementById('message').value = ''
    });
    setInterval(function(){
        let imagepreview = document.getElementById('image').value
        if (imagepreview != '') {
            $('#imagepreview').addClass('active')
        }else{
            $('#imagepreview').removeClass('active')
        }
    },500)
</script>
<script src="https://kit.fontawesome.com/6f3c57e22e.js" crossorigin="anonymous"></script>
</html>
